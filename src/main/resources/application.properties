spring.application.name=payment-service
server.port=8084

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_service_db
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Logging
logging.file.name=logs/payment-service.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.org.example.paymentservice=DEBUG

# Wompi (sandbox)
wompi.base-url=https://sandbox.wompi.co/v1

# Load local secrets (not committed to git)
spring.config.import=optional:classpath:application-local.properties